name: web-ssh-gateway

services:
  mcp-postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-postgres
    hostname: mcp-postgres
    networks:
      internal_net: {}
    volumes:
      - mcp_postgres_data:/var/lib/postgresql/data
      - ./mcp-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  sshd:
    build:
      context: sshd
      dockerfile: Dockerfile
    container_name: ssh-gateway-sshd
    hostname: sshd
    networks:
      internal_net: {}
    volumes:
      - ${WORKSPACE_HOST_PATH:-..}:${WORKSPACE_CONTAINER_PATH:-/workspace}:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "sshd", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ssh-gateway-redis
    networks:
      internal_net: {}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-server:
    # `image:` names the CI-built, git-SHA-tagged artifact (see
    # .github/workflows/ci.yml's build-and-push job) — `docker compose
    # pull && up` deploys exactly what passed CI. `build:` stays for local
    # dev iteration (`up --build`); it is NOT how a real deploy works.
    image: ${MCP_SERVER_IMAGE:-mcp-server:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp-server
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: mcp-server
    hostname: mcp-server
    networks:
      internal_net: {}
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - GATEWAY_BASE_URL=http://web-ssh-gateway:8085
      - GATEWAY_API_KEY=${MCP_GATEWAY_API_KEY:?set MCP_GATEWAY_API_KEY}
      # Default stays "mcp_client" (fully read-only) -- override via
      # docker/.env to "mcp_client_write" for project file write/edit/patch
      # + git add/commit/push. require_safe_mode() (scripts/mcp_sse_serve.py,
      # reused by the streamable-http entrypoint this service runs) hard-fails
      # at startup on any other value -- Docker admin, agent-launch, and
      # postgres tools are never reachable through either private mode.
      - MCP_GATEWAY_TOOL_MODE=${MCP_GATEWAY_TOOL_MODE:-mcp_client}
      - MCP_CLIENT_SAFE_MODE=${MCP_CLIENT_SAFE_MODE:-true}
      - MCP_ACCESS_PROFILE=${MCP_ACCESS_PROFILE:-mcp_client_safe}
      - MCP_STREAMABLE_HTTP_HOST=0.0.0.0
      - MCP_STREAMABLE_HTTP_PORT=8087
      - MCP_STREAMABLE_HTTP_ALLOW_NON_LOOPBACK=true
      - MCP_STREAMABLE_HTTP_BEARER_TOKEN=${MCP_STREAMABLE_HTTP_BEARER_TOKEN:?set MCP_STREAMABLE_HTTP_BEARER_TOKEN}
      - MCP_TOKEN_STORE_FILE=/app/data/mcp_tokens.json
    volumes:
      - ../projects.yaml:/app/projects.yaml:ro
      - mcp_server_tokens:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      web-ssh-gateway:
        condition: service_healthy

  mcp-oauth:
    # Same image as mcp-server -- docker/Dockerfile.mcp-server already
    # COPYs all of examples/, including examples/mcp_client_remote/server.py
    # (the full OAuth proxy: DCR, /authorize, consent, /token, in front of
    # an internal FastMCP instance) -- no new image needed, just a
    # different command. mcp-server itself stays bearer-only: FastMCP's
    # native OAuth (RequireAuthMiddleware, wired only when MCP_AUTH_MODE=
    # oauth) rejects a static bearer token with its own 401 (see
    # scripts/mcp_sse_serve.py's _force_fastmcp_auth_unwired() docstring
    # for the empirically-reproduced conflict) -- the two auth models
    # can't share one process, hence a second service instead of a flag
    # on the existing one.
    image: ${MCP_SERVER_IMAGE:-mcp-server:latest}
    command: ["python", "examples/mcp_client_remote/server.py"]
    container_name: mcp-oauth
    hostname: mcp-oauth
    networks:
      internal_net: {}
    ports:
      # MCP_OAUTH_HOST_PORT stays a throwaway port during verification;
      # only set to 8788 (matching the systemd service's own port, so the
      # existing autossh tunnel + VPS nginx config need no changes at all)
      # at actual cutover time, after systemd is stopped.
      - "127.0.0.1:${MCP_OAUTH_HOST_PORT:-18790}:8788"
    environment:
      - GATEWAY_BASE_URL=http://web-ssh-gateway:8085
      - GATEWAY_API_KEY=${MCP_OAUTH_GATEWAY_API_KEY:?set MCP_OAUTH_GATEWAY_API_KEY}
      - GATEWAY_SSH_HOST=${MCP_OAUTH_SSH_HOST:?set MCP_OAUTH_SSH_HOST}
      - GATEWAY_SSH_PORT=${MCP_OAUTH_SSH_PORT:?set MCP_OAUTH_SSH_PORT}
      - GATEWAY_SSH_USERNAME=${MCP_OAUTH_SSH_USERNAME:?set MCP_OAUTH_SSH_USERNAME}
      - GATEWAY_SSH_KEY_PATH=/app/ssh_key
      - MCP_GATEWAY_PROJECT_ROOT=${MCP_OAUTH_PROJECT_ROOT:-}
      - MCP_PROJECT_MAP_JSON=${MCP_OAUTH_PROJECT_MAP_JSON:-}
      - MCP_GATEWAY_TOOL_MODE=mcp_client
      - MCP_GATEWAY_WRITE_MODE=${MCP_OAUTH_WRITE_MODE:-handoff}
      - MCP_CLIENT_SAFE_MODE=true
      - MCP_ACCESS_PROFILE=mcp_client_safe
      - MCP_AUTH_MODE=oauth
      - MCP_ISSUER_URL=${MCP_OAUTH_ISSUER_URL:?set MCP_OAUTH_ISSUER_URL}
      - MCP_RESOURCE_URL=${MCP_OAUTH_RESOURCE_URL:?set MCP_OAUTH_RESOURCE_URL}
      - MCP_PUBLIC_URL=${MCP_OAUTH_PUBLIC_URL:?set MCP_OAUTH_PUBLIC_URL}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8788
      - MCP_INTERNAL_HOST=127.0.0.1
      - MCP_INTERNAL_PORT=8789
      - MCP_HEALTHCHECK_BEARER_TOKEN=${MCP_OAUTH_HEALTHCHECK_BEARER_TOKEN:-}
      - MCP_SCOPE_ENFORCEMENT=enforce
      - MCP_AGENT_BACKEND_ROUTER_ENABLED=true
      - MCP_AUTHORIZE_PASSWORD=${MCP_OAUTH_AUTHORIZE_PASSWORD:?set MCP_OAUTH_AUTHORIZE_PASSWORD}
      - MCP_TOKEN_STORE_FILE=/app/data/mcp_tokens.json
      - MCP_CLIENT_STORE_FILE=/app/data/mcp_clients.json
      - GITEA_TOKEN=${MCP_OAUTH_GITEA_TOKEN:-}
      - GITEA_API_BASE=${MCP_OAUTH_GITEA_API_BASE:-}
      - GITEA_FORWARDED_HOST=${MCP_OAUTH_GITEA_FORWARDED_HOST:-}
      - GITEA_FORWARDED_PROTO=${MCP_OAUTH_GITEA_FORWARDED_PROTO:-}
      - GITHUB_TOKEN=${MCP_OAUTH_GITHUB_TOKEN:-}
      - PGHOST=mcp-postgres
      - PGPORT=5432
      - PGDATABASE=${MCP_OAUTH_PGDATABASE:-gateway}
      - PGUSER=postgres
      - PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - PGSSLMODE=${MCP_OAUTH_PGSSLMODE:-disable}
      - PGAPPNAME=${MCP_OAUTH_PGAPPNAME:-mcp-oauth}
      - WORKSPACE_READONLY=${WORKSPACE_READONLY:-true}
    volumes:
      - ../projects.yaml:/app/projects.yaml:ro
      # Dedicated volume, deliberately NOT shared with mcp-server's
      # mcp_server_tokens -- keeps the OAuth client/token store
      # independent of the bearer-only service's.
      - mcp_oauth_data:/app/data
      - type: bind
        source: ${MCP_OAUTH_SSH_KEY_PATH:?set MCP_OAUTH_SSH_KEY_PATH}
        target: /app/ssh_key
        read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      web-ssh-gateway:
        condition: service_healthy
      mcp-postgres:
        condition: service_healthy

  web-ssh-gateway:
    # `image:` names the CI-built, git-SHA-tagged artifact (see
    # .github/workflows/ci.yml's build-and-push job) — `docker compose
    # pull && up` deploys exactly what passed CI. `build:` stays for local
    # dev iteration (`up --build`); it is NOT how a real deploy works.
    image: ${WEB_SSH_GATEWAY_IMAGE:-web-ssh-gateway:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: web-ssh-gateway
    hostname: web-ssh-gateway
    networks:
      internal_net: {}
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8085
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY:?set API_KEY}
      - AGENT_TOKEN=${AGENT_TOKEN:?set AGENT_TOKEN}
      - AGENT_TOKEN_TTL=${AGENT_TOKEN_TTL:-0}
      # ssh:execute:argv (execute_argv MCP tool / /api/ssh/execute-argv),
      # project:read + project:write (workspace read/write/edit/patch MCP
      # tools -- project:write implies project:read), diagnostics:read
      # and auth:read added for mcp_client_write mode (git add/commit/push
      # run through /api/ssh/execute-argv, not a scope of their own).
      - AGENT_TOKEN_SCOPES=["ssh:connect","ssh:execute","ssh:execute:argv","ssh:files","ssh:disconnect","ssh:port-check","jobs:read","jobs:run","project:read","project:write","diagnostics:read","auth:read"]
      - SSH_STRICT_HOST_KEY_CHECKING=true
      - KNOWN_HOSTS_STORE=file
      - KNOWN_HOSTS_FILE=/app/data/known_hosts
      - SSH_CONNECTION_POOL_SIZE=${SSH_CONNECTION_POOL_SIZE:-0}
      - SSH_CONNECTION_POOL_TTL_SECONDS=${SSH_CONNECTION_POOL_TTL_SECONDS:-60}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - AUTH_DB_PATH=/app/data/auth.sqlite3
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-1440}
      - PERSISTENT_SESSIONS_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@mcp-postgres:5432/gateway
      - WORKSPACE_READONLY=${WORKSPACE_READONLY:-true}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      - GATEWAY_SSH_HOST=sshd
      - GATEWAY_SSH_PORT=2222
      - OAUTH_PROVIDER=${OAUTH_PROVIDER:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_ISSUER_URL=${OAUTH_ISSUER_URL:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-}
      - OAUTH_ALLOWED_EMAILS=${OAUTH_ALLOWED_EMAILS:-}
      - OAUTH_DEFAULT_ROLE=${OAUTH_DEFAULT_ROLE:-operator}
    volumes:
      - ../projects.yaml:/app/projects.yaml:ro
      - ${WORKSPACE_HOST_PATH:-..}:${WORKSPACE_CONTAINER_PATH:-/workspace}:ro
      - ssh_keys:/app/ssh_keys:ro
      - gateway_logs:/app/logs
      - known_hosts:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # Same JSON-body status check as docker/Dockerfile's own HEALTHCHECK
      # (M17) -- this compose-level definition overrides it, so it needs
      # the same fix or deploy-from-registry.sh's smoke() would still only
      # ever see "the process accepted a connection", not "status == ok".
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; d = json.load(urllib.request.urlopen('http://localhost:8085/health', timeout=4)); sys.exit(0 if d.get('status') == 'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      mcp-postgres:
        condition: service_healthy

networks:
  public_net:
    external: true
    name: ${GATEWAY_PUBLIC_NETWORK:-public_net}
  internal_net:
    external: true

volumes:
  mcp_postgres_data:
    driver: local
  ssh_keys:
    driver: local
  gateway_logs:
    driver: local
  redis_data:
    driver: local
  known_hosts:
    driver: local
  mcp_server_tokens:
    driver: local
  mcp_oauth_data:
    driver: local
