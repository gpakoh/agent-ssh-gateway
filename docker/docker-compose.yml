name: web-ssh-gateway

services:
  mcp-postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-postgres
    hostname: mcp-postgres
    networks:
      internal_net: {}
    volumes:
      - mcp_postgres_data:/var/lib/postgresql/data
      - ./mcp-postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  sshd:
    build:
      context: sshd
      dockerfile: Dockerfile
    container_name: ssh-gateway-sshd
    hostname: sshd
    networks:
      internal_net: {}
    volumes:
      - ${WORKSPACE_HOST_PATH:-..}:${WORKSPACE_CONTAINER_PATH:-/workspace}:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "sshd", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: ssh-gateway-redis
    networks:
      internal_net: {}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp-server
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: mcp-server
    hostname: mcp-server
    networks:
      internal_net: {}
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - GATEWAY_BASE_URL=http://web-ssh-gateway:8085
      - GATEWAY_API_KEY=${MCP_GATEWAY_API_KEY:?set MCP_GATEWAY_API_KEY}
      - MCP_GATEWAY_TOOL_MODE=mcp_client
      - MCP_CLIENT_SAFE_MODE=true
      - MCP_ACCESS_PROFILE=mcp_client_safe
      - MCP_STREAMABLE_HTTP_HOST=0.0.0.0
      - MCP_STREAMABLE_HTTP_PORT=8087
      - MCP_STREAMABLE_HTTP_ALLOW_NON_LOOPBACK=true
      - MCP_STREAMABLE_HTTP_BEARER_TOKEN=${MCP_STREAMABLE_HTTP_BEARER_TOKEN:?set MCP_STREAMABLE_HTTP_BEARER_TOKEN}
    volumes:
      - ../projects.yaml:/app/projects.yaml:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      web-ssh-gateway:
        condition: service_healthy

  web-ssh-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: web-ssh-gateway
    hostname: web-ssh-gateway
    networks:
      internal_net: {}
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8085
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=${API_KEY:?set API_KEY}
      - AGENT_TOKEN=${AGENT_TOKEN:?set AGENT_TOKEN}
      - AGENT_TOKEN_TTL=${AGENT_TOKEN_TTL:-0}
      - AGENT_TOKEN_SCOPES=["ssh:connect","ssh:execute","ssh:files","ssh:disconnect","ssh:port-check","jobs:read"]
      - SSH_STRICT_HOST_KEY_CHECKING=true
      - KNOWN_HOSTS_STORE=file
      - KNOWN_HOSTS_FILE=/app/data/known_hosts
      - SSH_CONNECTION_POOL_SIZE=${SSH_CONNECTION_POOL_SIZE:-0}
      - SSH_CONNECTION_POOL_TTL_SECONDS=${SSH_CONNECTION_POOL_TTL_SECONDS:-60}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - AUTH_DB_PATH=/app/data/auth.sqlite3
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-1440}
      - PERSISTENT_SESSIONS_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@mcp-postgres:5432/gateway
      - WORKSPACE_READONLY=${WORKSPACE_READONLY:-true}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      - GATEWAY_SSH_HOST=sshd
      - GATEWAY_SSH_PORT=2222
      - OAUTH_PROVIDER=${OAUTH_PROVIDER:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_ISSUER_URL=${OAUTH_ISSUER_URL:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-}
      - OAUTH_ALLOWED_EMAILS=${OAUTH_ALLOWED_EMAILS:-}
      - OAUTH_DEFAULT_ROLE=${OAUTH_DEFAULT_ROLE:-operator}
    volumes:
      - ../projects.yaml:/app/projects.yaml:ro
      - ${WORKSPACE_HOST_PATH:-..}:${WORKSPACE_CONTAINER_PATH:-/workspace}:ro
      - ssh_keys:/app/ssh_keys:ro
      - gateway_logs:/app/logs
      - known_hosts:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      mcp-postgres:
        condition: service_healthy

networks:
  public_net:
    external: true
    name: ${GATEWAY_PUBLIC_NETWORK:-public_net}
  internal_net:
    external: true

volumes:
  mcp_postgres_data:
    driver: local
  ssh_keys:
    driver: local
  gateway_logs:
    driver: local
  redis_data:
    driver: local
  known_hosts:
    driver: local
