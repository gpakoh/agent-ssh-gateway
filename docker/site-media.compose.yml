# Opt-in cross-stack Media API client ONLY. The independent media-processing
# service, its registry digest and its isolated network belong to infra-quart.
# This overlay never creates or builds a media codec worker.
services:
  mcp-oauth:
    networks:
      internal_net: {}
      media_net: {}
    environment:
      SITE_MEDIA_WORKER_TOKEN: ${SITE_MEDIA_WORKER_TOKEN:?operator media client secret required}
      MEDIA_API_BASE_URL: http://media-processing:8091
networks:
  media_net:
    external: true
    name: quart-media-internal
