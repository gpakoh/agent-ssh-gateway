name: host-smoke

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    # MAJOR audit finding: paths: here didn't actually match what `make
    # host-smoke` (pytest -m host_smoke) exercises -- verified each test
    # file's real coverage rather than guessing:
    #   - test_opencode_runner_wrapper.py tests scripts/
    #     opencode_runner_wrapper.py directly (was entirely missing here)
    #   - test_run_compileall_uv_seam.py shells out to the real uv/uvx
    #     command examples/mcp_server/mcp_client_tools.py builds for the
    #     run_compileall fallback (also entirely missing)
    #   - test_mtls_e2e.py SSHes into the nginx host and greps its live
    #     config + drives requests through it -- the tracked templates
    #     for that config, and app/auth_middleware.py (the mTLS/X-SSL-*/
    #     X-API-Key header handling on the backend side), were missing
    #   - test_workspace_tools.py -> app/workspace/** (already correct)
    # The old "SSH execution stack / OAuth-MCP server are not exercised
    # by any host_smoke test" gap (#6) is now CLOSED:
    #   - test_mcp_oauth_host_smoke.py runs the FULL live black-box flow
    #     through the mcp-oauth container: DCR /register -> /authorize
    #     (PKCE S256) -> /oauth/consent (MCP_AUTHORIZE_PASSWORD) ->
    #     /token -> initialize -> tools/call git_status, which really
    #     executes a harmless SSH command (git status --short) through
    #     the Gateway (/api/ssh/execute-argv -> sshd) and asserts the
    #     exact result -- the MCP->Gateway->SSH->harmless command chain
    #     is now covered end to end (see scripts/mcp_oauth_black_box_
    #     smoke.py, driven by scripts/mcp_black_box_smoke.py's sibling).
    paths: ["Makefile", ".github/workflows/host-smoke.yml", "tests/test_mtls_e2e.py", "tests/test_opencode_runner_wrapper.py", "tests/test_workspace_tools.py", "tests/test_run_compileall_uv_seam.py", "tests/test_mcp_oauth_host_smoke.py", "tests/test_mcp_oauth_black_box_smoke.py", "app/workspace/**", "app/auth_middleware.py", "scripts/opencode_runner_wrapper.py", "scripts/mcp_oauth_black_box_smoke.py", "examples/mcp_server/mcp_client_tools.py", "nginx-gateway.conf.example", "nginx-ssh-gateway.conf"]

# Same rationale as ci.yml's top-level concurrency block: two
# close-together master pushes touching these paths would otherwise run
# host-level smoke tests concurrently against the same shared host
# resources (real /media, nginx, Redis) -- serialize instead of racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-smoke:
    name: Host smoke
    # Self-hosted Gitea runner only (label host-smoke-ci, Gitea at
    # git.example.com) — needs real /media, nginx certs and Redis, which
    # GitHub's hosted runners don't have. GitHub would queue this job
    # forever without a matching runner, so skip it there entirely via
    # github.server_url — same guard as ci.yml's build-and-push/deploy.
    # NOTE: must live in .github/workflows (NOT .gitea/workflows): Gitea
    # 1.26 scans only .gitea/workflows when that directory exists and
    # silently ignores .github/workflows, which would kill ci.yml.
    if: github.server_url != 'https://github.com'
    runs-on: host-smoke-ci
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        run: |
          python3 --version
          /media/1TB/Anaconda/bin/uv sync --frozen --extra dev

      - name: Make host-smoke
        run: /media/1TB/Anaconda/bin/uv run make host-smoke

      - name: Report
        run: |
          echo "host-smoke completed"
          git rev-parse --short HEAD
