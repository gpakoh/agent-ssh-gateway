name: host-smoke

on:
  workflow_dispatch:
  # Manual diagnostics ONLY. The authoritative host-smoke gate no longer
  # lives here -- it runs as a ci.yml job strictly AFTER a successful
  # deploy of the exact commit being smoked (needs: deploy + a fail-closed
  # BUILD_SHA == github.sha check on web-ssh-gateway/mcp-server/mcp-oauth
  # before and after the OAuth black-box smoke).  The old push trigger with
  # a paths: filter had NO ordering guarantee vs the deploy job: it could
  # start (and PASS) against whatever was already up while the commit that
  # triggered it had not even been deployed yet.  `make host-smoke` content
  # coverage requires no paths: list here precisely because this workflow
  # no longer gates anything; it exists so an operator can re-run the same
  # host-level pytest suite by hand against a live stack.

# Manual runs serialize like ci.yml's block does; a manual re-run replaces
# nothing mid-flight (cancel-in-progress: false keeps them from cancelling
# each other if two dispatches land close together).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-smoke:
    name: Host smoke (manual)
    # Self-hosted Gitea runner only (label host-smoke-ci, Gitea at
    # git.example.com) — needs real /media, nginx certs and Redis, which
    # GitHub's hosted runners don't have. GitHub would queue this job
    # forever without a matching runner, so skip it there entirely via
    # github.server_url — same guard as ci.yml's build-and-push/deploy.
    # NOTE: must live in .github/workflows (NOT .gitea/workflows): Gitea
    # 1.26 scans only .gitea/workflows when that directory exists and
    # silently ignores .github/workflows, which would kill ci.yml.
    if: github.server_url != 'https://github.com'
    runs-on: host-smoke-ci
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        run: |
          python3 --version
          /media/1TB/Anaconda/bin/uv sync --frozen --extra dev

      - name: Make host-smoke
        run: /media/1TB/Anaconda/bin/uv run make host-smoke

      - name: Report
        run: |
          echo "host-smoke completed"
          git rev-parse --short HEAD
