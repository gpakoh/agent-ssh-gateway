name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# MAJOR audit finding: this workflow's deploy job runs
# scripts/deploy-from-registry.sh directly against the host's live
# containers/DB migrations with no lock of its own -- two close-together
# pushes to master could run deploy A and deploy B in parallel, both
# recreating the same containers, both running `alembic upgrade head`,
# both reading/writing the same rollback state, racing each other's
# health checks. group scopes by ref, so PRs on different branches (and
# master) never block each other; cancel-in-progress only for non-master
# refs -- a PR's superseded run is safe to abandon mid-flight, but a
# master push must never abort mid-deploy, so same-ref master runs queue
# strictly one-at-a-time instead. DEPLOY_SHA (see the deploy job below)
# stays as defense-in-depth for the narrower race this doesn't cover: a
# manual re-run or workflow_dispatch replay landing between two ordinary
# pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - name: Checkout exact event commit from Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$expected_sha" | grep -qxE '[0-9a-f]{40}' || {
            echo "::error::event head is not a lowercase 40-hex SHA" >&2
            exit 1
          }
          : "${GITEA_TOKEN:?GITEA_TOKEN is required for the private repository checkout}"
          repo_url="${{ github.server_url }}/${{ github.repository }}.git"
          gitea_token="$GITEA_TOKEN"
          unset GITEA_TOKEN
          auth_header="Authorization: Basic $(printf '%s' "x-access-token:${gitea_token}" | base64 | tr -d '\r\n')"
          gitea_token=""
          unset gitea_token

          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ] || [ -L "$GITHUB_WORKSPACE" ]; then
            echo "::error::GITHUB_WORKSPACE must be an existing non-symlink directory" >&2
            exit 1
          fi
          case "$GITHUB_WORKSPACE" in
            /*) ;;
            *) echo "::error::GITHUB_WORKSPACE must be absolute" >&2; exit 1 ;;
          esac
          case "$GITHUB_WORKSPACE" in
            *[!/]*) ;;
            *) echo "::error::GITHUB_WORKSPACE must not be the filesystem root" >&2; exit 1 ;;
          esac
          case "/$GITHUB_WORKSPACE/" in
            *"/../"*) echo "::error::GITHUB_WORKSPACE must not contain .. segments" >&2; exit 1 ;;
          esac
          rm -rf -- "$GITHUB_WORKSPACE/.git"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          (
            export GIT_TERMINAL_PROMPT=0
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0="http.${repo_url}.extraHeader"
            export GIT_CONFIG_VALUE_0="$auth_header"
            export GIT_CONFIG_KEY_1="http.${repo_url}.followRedirects"
            export GIT_CONFIG_VALUE_1="false"
            git fetch -q --no-tags origin "$expected_sha" '+refs/heads/*:refs/remotes/origin/*'
          )
          auth_header=""
          unset auth_header
          git checkout -q -f --detach "$expected_sha"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$expected_sha"
          test -z "$(git status --porcelain)"
      - name: Check scope regression cases without application dependencies
        run: python3 -m unittest tests.test_ci_change_scope
      - name: Classify exact diff and check documentation whitespace
        id: classify
        run: python3 scripts/ci_change_scope.py

  test:
    needs: [scope]
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_ci == 'true'
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # No job in this workflow had a timeout at all -- a genuinely hung
    # step (network stall, a test deadlocking) would run until GitHub's
    # own default (360 minutes) or the self-hosted runner's own limits,
    # occupying a runner slot the whole time instead of failing fast.
    # Keep this above Makefile's 70m unit-suite process guard so integration,
    # smoke, collection-count and audit steps retain bounded completion time.
    timeout-minutes: 90
    env:
      CI_PACKAGE_HTTP_PROXY: ${{ secrets.CI_PACKAGE_HTTP_PROXY }}
      CI_PACKAGE_HTTPS_PROXY: ${{ secrets.CI_PACKAGE_HTTPS_PROXY }}
      CI_PACKAGE_NO_PROXY: ${{ secrets.CI_PACKAGE_NO_PROXY }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout exact event commit from Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$expected_sha" | grep -qxE '[0-9a-f]{40}' || {
            echo "::error::event head is not a lowercase 40-hex SHA" >&2
            exit 1
          }
          : "${GITEA_TOKEN:?GITEA_TOKEN is required for the private repository checkout}"
          repo_url="${{ github.server_url }}/${{ github.repository }}.git"
          gitea_token="$GITEA_TOKEN"
          unset GITEA_TOKEN
          auth_header="Authorization: Basic $(printf '%s' "x-access-token:${gitea_token}" | base64 | tr -d '\r\n')"
          gitea_token=""
          unset gitea_token

          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ] || [ -L "$GITHUB_WORKSPACE" ]; then
            echo "::error::GITHUB_WORKSPACE must be an existing non-symlink directory" >&2
            exit 1
          fi
          case "$GITHUB_WORKSPACE" in
            /*) ;;
            *) echo "::error::GITHUB_WORKSPACE must be absolute" >&2; exit 1 ;;
          esac
          case "$GITHUB_WORKSPACE" in
            *[!/]*) ;;
            *) echo "::error::GITHUB_WORKSPACE must not be the filesystem root" >&2; exit 1 ;;
          esac
          case "/$GITHUB_WORKSPACE/" in
            *"/../"*) echo "::error::GITHUB_WORKSPACE must not contain .. segments" >&2; exit 1 ;;
          esac
          rm -rf -- "$GITHUB_WORKSPACE/.git"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          (
            export GIT_TERMINAL_PROMPT=0
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0="http.${repo_url}.extraHeader"
            export GIT_CONFIG_VALUE_0="$auth_header"
            export GIT_CONFIG_KEY_1="http.${repo_url}.followRedirects"
            export GIT_CONFIG_VALUE_1="false"
            git fetch -q --no-tags origin "$expected_sha" '+refs/heads/*:refs/remotes/origin/*'
          )
          auth_header=""
          unset auth_header
          git checkout -q -f --detach "$expected_sha"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$expected_sha"
          test -z "$(git status --porcelain)"

      - name: Configure package proxy
        run: |
          package_proxy_enabled=false
          if [ -n "${CI_PACKAGE_HTTP_PROXY:-}" ]; then
            echo "HTTP_PROXY=$CI_PACKAGE_HTTP_PROXY" >> "$GITHUB_ENV"
            echo "http_proxy=$CI_PACKAGE_HTTP_PROXY" >> "$GITHUB_ENV"
            package_proxy_enabled=true
          fi
          package_https_proxy="${CI_PACKAGE_HTTPS_PROXY:-${CI_PACKAGE_HTTP_PROXY:-}}"
          if [ -n "$package_https_proxy" ]; then
            echo "HTTPS_PROXY=$package_https_proxy" >> "$GITHUB_ENV"
            echo "https_proxy=$package_https_proxy" >> "$GITHUB_ENV"
            package_proxy_enabled=true
          fi
          if [ "$package_proxy_enabled" = "true" ]; then
            package_no_proxy="${CI_PACKAGE_NO_PROXY:-${{ vars.CI_PACKAGE_NO_PROXY }}}"
            echo "NO_PROXY=$package_no_proxy" >> "$GITHUB_ENV"
            echo "no_proxy=$package_no_proxy" >> "$GITHUB_ENV"
            echo "::notice::CI package proxy enabled for dependency install and audit steps"
          fi

      - name: Install package (frozen lockfile)
        run: |
          pip_install=(python -m pip)
          if ! "${pip_install[@]}" --version >/dev/null 2>&1; then
            if command -v pip3 >/dev/null 2>&1 && pip3 --version >/dev/null 2>&1; then
              pip_install=(pip3)
            elif command -v pip >/dev/null 2>&1 && pip --version >/dev/null 2>&1; then
              pip_install=(pip)
            else
              rm -rf .ci-bootstrap-venv
              python -m venv .ci-bootstrap-venv
              pip_install=(.ci-bootstrap-venv/bin/python -m pip)
            fi
          fi
          "${pip_install[@]}" --version
          uv_ready=false
          for attempt in 1 2 3 4 5; do
            if "${pip_install[@]}" install uv; then
              uv_ready=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "::warning::pip install uv attempt ${attempt}/5 failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          if [ "$uv_ready" != "true" ]; then
            echo "::warning::pip install uv retries exhausted; trying one direct fallback without proxy env"
            if env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy "${pip_install[@]}" install uv; then
              uv_ready=true
            fi
          fi
          if [ "$uv_ready" != "true" ]; then
            exit 1
          fi

          requested_python="${{ matrix.python-version }}"
          if python_path="$(uv python find "$requested_python" 2>/dev/null)"; then
            :
          else
            python_path=""
          fi
          if [ -z "$python_path" ]; then
            python_ready=false
            for attempt in 1 2 3 4 5; do
              if UV_HTTP_TIMEOUT=60 uv python install "$requested_python"; then
                python_ready=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 10))
                echo "::warning::uv python install $requested_python attempt ${attempt}/5 failed, retrying in ${delay}s..."
                sleep "$delay"
              fi
            done
            if [ "$python_ready" != "true" ]; then
              echo "::warning::uv python install retries exhausted; trying one direct fallback without proxy env"
              if env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy UV_HTTP_TIMEOUT=60 uv python install "$requested_python"; then
                python_ready=true
              fi
            fi
            if [ "$python_ready" != "true" ]; then
              exit 1
            fi
            python_path="$(uv python find "$requested_python")"
          fi
          actual_python="$("$python_path" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$actual_python" != "$requested_python" ]; then
            echo "::error::resolved Python $actual_python at $python_path, expected $requested_python" >&2
            exit 1
          fi
          export UV_PYTHON="$python_path"
          echo "UV_PYTHON=$python_path" >> "$GITHUB_ENV"
          echo "Using Python $actual_python from $python_path"

          for attempt in 1 2 3 4 5; do
            if UV_HTTP_TIMEOUT=60 uv sync --frozen --extra dev; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "::warning::uv sync attempt ${attempt}/5 failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::warning::uv sync retries exhausted; trying one direct fallback without proxy env"
          if env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy UV_HTTP_TIMEOUT=60 uv sync --frozen --extra dev; then
            exit 0
          fi
          exit 1

      - name: Lockfile freshness
        run: make lockfile-check

      - name: Ruff
        run: make lint

      - name: Mypy
        run: make mypy

      - name: Tests + coverage
        # --only-rerun WebSocketDisconnect: Starlette's in-process WebSocket
        # TestClient occasionally drops a pending response under CI resource
        # contention (not reproducible locally, see TODO.md [CI-005]) — retry
        # ONLY that specific failure signature so a real regression in any
        # other test still fails the build on the first try.
        #
        # MAJOR audit finding (CI-04): this step and `make test-unit` used
        # to be two separately-maintained copies of the same pytest
        # invocation, free to drift apart silently. Now calls the Makefile
        # target directly -- the flags exist in exactly one place.
        run: make test-unit PYTEST_UNIT_ARGS="--junitxml=test-results.xml"

      - name: Integration tests
        run: make test-integration

      - name: Portable smoke tests
        run: make test-smoke

      - name: Verify test count
        run: make test-count

      - name: pip-audit
        # Two separate problems compounded here, both against pypi.org
        # specifically (not the Fastly CDN generally: plain HTTP to the same
        # IP, and HTTPS to files.pythonhosted.org, both work fine from these
        # containers; api.osv.dev works fine too) -- almost certainly this
        # runner pool's Docker network egressing through a different uplink
        # than the host itself via the LAN router's multi-WAN flow-based
        # load balancing, with one uplink currently unable to complete a TLS
        # handshake to pypi.org:
        #   1. Passing a project_path ('.') makes pip-audit do a FRESH
        #      dependency resolution (shelling out to pip), which itself
        #      talks to pypi.org's package INDEX independent of the
        #      vulnerability lookup -- this hung with ZERO output even with
        #      --dry-run (collection only, no vulnerability queries at all)
        #      and even with -s osv, since -s only changes where the
        #      vulnerability *lookup* goes, not dependency collection.
        #   2. The default vulnerability service (pypi) queries pypi.org's
        #      JSON API once per dependency; with dozens of dependencies
        #      each hitting the broken path, a single invocation could spend
        #      minutes in urllib3's own retry/backoff before failing even
        #      once.
        # Fix for both: -l/--local audits the already-installed venv (from
        # the "Install package" step above) directly, with no project_path
        # and no fresh pip-based resolution; -s osv sends the vulnerability
        # lookups to Google's OSV API instead of pypi.org's. Still retries
        # on a network-exception signature as a backstop, and also treats
        # HTTP 5xx as a transient external-service failure: osv.dev answered
        # `HTTPError: 501 Server Error: Not Implemented` on PR #344 (run
        # #11810), and requests renders ANY 5xx as "<code> Server Error:
        # <reason> for url: ...". The grep matches only that 5xx "Server
        # Error" class -- 4xx ("Client Error") and a real vulnerability
        # finding are clean, structured pip-audit failures with no such
        # signature and still fail on the first attempt, no retry.
        run: |
          set +e
          audit_no_proxy="${NO_PROXY:-}"
          case ",$audit_no_proxy," in
            *,api.osv.dev,*) ;;
            *) audit_no_proxy="${audit_no_proxy:+${audit_no_proxy},}api.osv.dev" ;;
          esac
          export NO_PROXY="$audit_no_proxy" no_proxy="$audit_no_proxy"
          max_attempts=5
          timeout_seconds=60
          heartbeat_seconds=20
          stop_heartbeat() {
            if [ -n "${heartbeat_pid:-}" ]; then
              kill "$heartbeat_pid" >/dev/null 2>&1
              wait "$heartbeat_pid" 2>/dev/null
              heartbeat_pid=""
            fi
          }
          for attempt in $(seq 1 "$max_attempts"); do
            audit_log="$(mktemp)"
            heartbeat_pid=""
            (
              while true; do
                sleep "$heartbeat_seconds"
                echo "::notice::pip-audit attempt ${attempt}/${max_attempts} still running after ${heartbeat_seconds}s heartbeat interval"
              done
            ) &
            heartbeat_pid="$!"
            uv run pip-audit -l -s osv --strict --timeout "$timeout_seconds" --progress-spinner=off 2>&1 | tee "$audit_log"
            status=${PIPESTATUS[0]}
            stop_heartbeat
            if [ "$status" -eq 0 ]; then
              rm -f "$audit_log"
              exit 0
            fi
            if grep -qE "ReadTimeout|ConnectTimeout|ConnectionError|Read timed out|Connection reset|Temporary failure in name resolution|Network is unreachable|TimeoutError|SSLError|ProxyError|RemoteDisconnected|handshake operation timed out|HTTPError: 5[0-9]{2} Server Error" "$audit_log"; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                delay=$((attempt * 10))
                echo "::warning::pip-audit attempt ${attempt}/${max_attempts} failed with a transient network or service error, retrying in ${delay}s..."
                rm -f "$audit_log"
                sleep "$delay"
                continue
              fi
              echo "::error::pip-audit failed after ${max_attempts} attempts due to persistent network or service errors"
              rm -f "$audit_log"
              exit 1
            fi
            rm -f "$audit_log"
            exit $status
          done
          echo "::error::pip-audit exited retry loop unexpectedly"
          exit 1

  fleet-postgres:
    needs: [scope]
    if: github.event_name == 'pull_request' && needs.scope.outputs.full_ci == 'true' && github.server_url != 'https://github.com'
    name: Fleet PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_PACKAGE_HTTP_PROXY: ${{ secrets.CI_PACKAGE_HTTP_PROXY }}
      CI_PACKAGE_HTTPS_PROXY: ${{ secrets.CI_PACKAGE_HTTPS_PROXY }}
      CI_PACKAGE_NO_PROXY: ${{ secrets.CI_PACKAGE_NO_PROXY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Configure package proxy
        run: |
          set -euo pipefail
          if [ -n "${CI_PACKAGE_HTTP_PROXY:-}" ]; then
            echo "HTTP_PROXY=$CI_PACKAGE_HTTP_PROXY" >> "$GITHUB_ENV"
            echo "http_proxy=$CI_PACKAGE_HTTP_PROXY" >> "$GITHUB_ENV"
          fi
          package_https_proxy="${CI_PACKAGE_HTTPS_PROXY:-${CI_PACKAGE_HTTP_PROXY:-}}"
          if [ -n "$package_https_proxy" ]; then
            echo "HTTPS_PROXY=$package_https_proxy" >> "$GITHUB_ENV"
            echo "https_proxy=$package_https_proxy" >> "$GITHUB_ENV"
          fi
          package_no_proxy="${CI_PACKAGE_NO_PROXY:-${{ vars.CI_PACKAGE_NO_PROXY }}}"
          package_no_proxy="${package_no_proxy:+${package_no_proxy},}postgres,127.0.0.1,localhost"
          echo "NO_PROXY=$package_no_proxy" >> "$GITHUB_ENV"
          echo "no_proxy=$package_no_proxy" >> "$GITHUB_ENV"
      - name: Install Python 3.12 test environment
        run: |
          set -euo pipefail
          pip_install=(python -m pip)
          if ! "${pip_install[@]}" --version >/dev/null 2>&1; then
            if command -v pip3 >/dev/null 2>&1 && pip3 --version >/dev/null 2>&1; then
              pip_install=(pip3)
            elif command -v pip >/dev/null 2>&1 && pip --version >/dev/null 2>&1; then
              pip_install=(pip)
            else
              rm -rf .ci-bootstrap-venv
              python -m venv .ci-bootstrap-venv
              pip_install=(.ci-bootstrap-venv/bin/python -m pip)
            fi
          fi
          "${pip_install[@]}" --version
          "${pip_install[@]}" install uv
          UV_HTTP_TIMEOUT=60 uv python install 3.12
          python_path="$(uv python find 3.12)"
          test "$("$python_path" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
          echo "UV_PYTHON=$python_path" >> "$GITHUB_ENV"
          UV_PYTHON="$python_path" UV_HTTP_TIMEOUT=60 uv sync --frozen --extra dev
      - name: Start isolated Fleet postgres
        # Every job container on this runner pool shares internal_net, so a
        # `services:` postgres would give every parallel run the same DNS alias
        # on one network and resolve round-robin onto a foreign container
        # (asyncpg InvalidPasswordError). Start a per-run container on the job
        # container's own network instead, reach it by container IP (the shared
        # internal_net resolver has been seen to intermittently return NXDOMAIN
        # for a fresh alias), and remove it in a dedicated always() step: an
        # EXIT trap here would fire when this step's shell ends and delete the
        # container before the tests run.
        run: |
          set -euo pipefail
          pg_name="fleet-pg-${GITHUB_RUN_ID}"
          pg_net="$(docker inspect "$(hostname)" \
            --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}};{{end}}' \
            | cut -d';' -f1)"
          [ -n "$pg_net" ] || { echo "::error::could not detect job container network" >&2; exit 1; }
          docker ps -a --filter "name=^/${pg_name}$" --format '{{.Names}}' | grep -qx "$pg_name" || \
            docker run -d --rm --name "$pg_name" \
              --network "$pg_net" --network-alias "$pg_name" \
              -e POSTGRES_PASSWORD=fleet-ci-only \
              -e POSTGRES_DB=fleet_test \
              pgvector/pgvector:pg16 >/dev/null
          ready=""
          for i in $(seq 1 90); do
            if docker exec "$pg_name" pg_isready -U postgres -d fleet_test -h 127.0.0.1 >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Fleet postgres did not become ready" >&2
            docker logs --tail 30 "$pg_name" 2>&1 || true
            exit 1
          fi
          pg_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$pg_name")"
          if [ -z "$pg_ip" ]; then
            echo "::error::could not resolve Fleet postgres IP on $pg_net" >&2
            docker inspect "$pg_name" 2>&1 || true
            exit 1
          fi
          echo "fleet postgres: name=$pg_name net=$pg_net ip=$pg_ip"
          echo "FLEET_TEST_PG_DSN=postgresql://postgres:fleet-ci-only@${pg_ip}:5432/fleet_test" >> "$GITHUB_ENV"
      - name: Fleet recovery real-Postgres regressions
        run: |
          set -euo pipefail
          uv run pytest tests/test_fleet_recovery_pg.py -q -rs --junitxml=fleet-pg-results.xml
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("fleet-pg-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          failures = sum(int(suite.attrib.get("failures", "0")) for suite in suites)
          errors = sum(int(suite.attrib.get("errors", "0")) for suite in suites)
          if tests <= 0 or skipped != 0 or failures != 0 or errors != 0:
              print(
                  f"Fleet PostgreSQL execution proof failed: tests={tests}, "
                  f"skipped={skipped}, failures={failures}, errors={errors}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"Fleet PostgreSQL execution proof: tests={tests}, skipped=0")
          PY
      - name: Remove isolated Fleet postgres
        # Job-scoped cleanup: a trap inside the start step would run when that
        # step's shell exits, deleting the container before the tests connect.
        if: always()
        run: docker rm -f "fleet-pg-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true

  e2e:
    # MAJOR audit finding: pytest -m "not host_smoke and not e2e" above
    # deliberately excludes tests/test_webui_e2e.py's 4 Selenium/headless-
    # Chromium browser tests -- e2e's own pyproject.toml marker docstring
    # already says why ("the CI container may not ship Selenium/
    # Chromium"), but nothing anywhere ever actually ran them; they were
    # simply never executed by any CI path. Separate job (not a step
    # added to `test`) so a browser/driver hiccup here can't block the
    # fast unit-test signal, and its own pass/fail is clearly attributed.
    # The browser runtime is platform-specific but explicit. GitHub-hosted
    # ubuntu-latest uses its preinstalled Chrome/ChromeDriver. Gitea maps the
    # same label to nod-ci-python311, which has no browser, so that path starts
    # a digest-pinned Selenium Chromium sidecar sharing only this job's network
    # namespace. The tests boot their own loopback uvicorn server and need no
    # host-specific nginx/SSH/media infrastructure.
    needs: [test]
    name: E2E (Selenium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gitea maps ubuntu-latest to nod-ci-python311, which intentionally has
    # Python tooling but no browser. The Gitea path starts a digest-pinned
    # Selenium sidecar in the existing job container's network namespace;
    # GitHub-hosted runners keep their preinstalled local Chrome path.
    env:
      CI_PACKAGE_HTTP_PROXY: ${{ secrets.CI_PACKAGE_HTTP_PROXY }}
      CI_PACKAGE_HTTPS_PROXY: ${{ secrets.CI_PACKAGE_HTTPS_PROXY }}
      CI_PACKAGE_NO_PROXY: ${{ secrets.CI_PACKAGE_NO_PROXY }}
    steps:
      - name: Checkout exact event commit from Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          printf '%s\n' "$expected_sha" | grep -qxE '[0-9a-f]{40}' || {
            echo "::error::event head is not a lowercase 40-hex SHA" >&2
            exit 1
          }
          : "${GITEA_TOKEN:?GITEA_TOKEN is required for the private repository checkout}"
          repo_url="${{ github.server_url }}/${{ github.repository }}.git"
          gitea_token="$GITEA_TOKEN"
          unset GITEA_TOKEN
          auth_header="Authorization: Basic $(printf '%s' "x-access-token:${gitea_token}" | base64 | tr -d '\r\n')"
          gitea_token=""
          unset gitea_token

          if [ -z "${GITHUB_WORKSPACE:-}" ] || [ ! -d "$GITHUB_WORKSPACE" ] || [ -L "$GITHUB_WORKSPACE" ]; then
            echo "::error::GITHUB_WORKSPACE must be an existing non-symlink directory" >&2
            exit 1
          fi
          case "$GITHUB_WORKSPACE" in
            /*) ;;
            *) echo "::error::GITHUB_WORKSPACE must be absolute" >&2; exit 1 ;;
          esac
          case "$GITHUB_WORKSPACE" in
            *[!/]*) ;;
            *) echo "::error::GITHUB_WORKSPACE must not be the filesystem root" >&2; exit 1 ;;
          esac
          case "/$GITHUB_WORKSPACE/" in
            *"/../"*) echo "::error::GITHUB_WORKSPACE must not contain .. segments" >&2; exit 1 ;;
          esac
          rm -rf -- "$GITHUB_WORKSPACE/.git"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$repo_url"
          (
            export GIT_TERMINAL_PROMPT=0
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0="http.${repo_url}.extraHeader"
            export GIT_CONFIG_VALUE_0="$auth_header"
            export GIT_CONFIG_KEY_1="http.${repo_url}.followRedirects"
            export GIT_CONFIG_VALUE_1="false"
            git fetch -q --no-tags origin "$expected_sha" '+refs/heads/*:refs/remotes/origin/*'
          )
          auth_header=""
          unset auth_header
          git checkout -q -f --detach "$expected_sha"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$expected_sha"
          test -z "$(git status --porcelain)"

      - name: Configure package proxy
        run: |
          package_proxy_enabled=false
          if [ -n "${CI_PACKAGE_HTTP_PROXY:-}" ]; then
            echo "HTTP_PROXY=$CI_PACKAGE_HTTP_PROXY" >> "$GITHUB_ENV"
            echo "http_proxy=$CI_PACKAGE_HTTP_PROXY" >> "$GITHUB_ENV"
            package_proxy_enabled=true
          fi
          package_https_proxy="${CI_PACKAGE_HTTPS_PROXY:-${CI_PACKAGE_HTTP_PROXY:-}}"
          if [ -n "$package_https_proxy" ]; then
            echo "HTTPS_PROXY=$package_https_proxy" >> "$GITHUB_ENV"
            echo "https_proxy=$package_https_proxy" >> "$GITHUB_ENV"
            package_proxy_enabled=true
          fi
          if [ "$package_proxy_enabled" = "true" ]; then
            package_no_proxy="${CI_PACKAGE_NO_PROXY:-${{ vars.CI_PACKAGE_NO_PROXY }}}"
            echo "NO_PROXY=$package_no_proxy" >> "$GITHUB_ENV"
            echo "no_proxy=$package_no_proxy" >> "$GITHUB_ENV"
            echo "::notice::CI package proxy enabled for dependency install and audit steps"
          fi

      - name: Install package (frozen lockfile)
        run: |
          pip_install=(python -m pip)
          if ! "${pip_install[@]}" --version >/dev/null 2>&1; then
            if command -v pip3 >/dev/null 2>&1 && pip3 --version >/dev/null 2>&1; then
              pip_install=(pip3)
            elif command -v pip >/dev/null 2>&1 && pip --version >/dev/null 2>&1; then
              pip_install=(pip)
            else
              rm -rf .ci-bootstrap-venv
              python -m venv .ci-bootstrap-venv
              pip_install=(.ci-bootstrap-venv/bin/python -m pip)
            fi
          fi
          "${pip_install[@]}" --version
          uv_ready=false
          for attempt in 1 2 3 4 5; do
            if "${pip_install[@]}" install uv; then
              uv_ready=true
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "::warning::pip install uv attempt ${attempt}/5 failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          if [ "$uv_ready" != "true" ]; then
            echo "::warning::pip install uv retries exhausted; trying one direct fallback without proxy env"
            if env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy "${pip_install[@]}" install uv; then
              uv_ready=true
            fi
          fi
          if [ "$uv_ready" != "true" ]; then
            exit 1
          fi

          requested_python="3.12"
          if python_path="$(uv python find "$requested_python" 2>/dev/null)"; then
            :
          else
            python_path=""
          fi
          if [ -z "$python_path" ]; then
            python_ready=false
            for attempt in 1 2 3 4 5; do
              if UV_HTTP_TIMEOUT=60 uv python install "$requested_python"; then
                python_ready=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                delay=$((attempt * 10))
                echo "::warning::uv python install $requested_python attempt ${attempt}/5 failed, retrying in ${delay}s..."
                sleep "$delay"
              fi
            done
            if [ "$python_ready" != "true" ]; then
              echo "::warning::uv python install retries exhausted; trying one direct fallback without proxy env"
              if env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy UV_HTTP_TIMEOUT=60 uv python install "$requested_python"; then
                python_ready=true
              fi
            fi
            if [ "$python_ready" != "true" ]; then
              exit 1
            fi
            python_path="$(uv python find "$requested_python")"
          fi
          actual_python="$("$python_path" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          if [ "$actual_python" != "$requested_python" ]; then
            echo "::error::resolved Python $actual_python at $python_path, expected $requested_python" >&2
            exit 1
          fi
          export UV_PYTHON="$python_path"
          echo "UV_PYTHON=$python_path" >> "$GITHUB_ENV"
          echo "Using Python $actual_python from $python_path"

          for attempt in 1 2 3 4 5; do
            if UV_HTTP_TIMEOUT=60 uv sync --frozen --extra dev; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 10))
              echo "::warning::uv sync attempt ${attempt}/5 failed, retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::warning::uv sync retries exhausted; trying one direct fallback without proxy env"
          if env -u HTTP_PROXY -u HTTPS_PROXY -u http_proxy -u https_proxy -u ALL_PROXY -u all_proxy UV_HTTP_TIMEOUT=60 uv sync --frozen --extra dev; then
            exit 0
          fi
          exit 1

      - name: Put preinstalled ChromeDriver on PATH
        if: github.server_url == 'https://github.com'
        run: echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"

      - name: Start pinned Selenium Chromium sidecar
        if: github.server_url != 'https://github.com'
        run: |
          set -euo pipefail
          job_container="$(hostname)"
          docker inspect "$job_container" >/dev/null
          selenium_image="ghcr.io/seleniumhq/standalone-chromium:150.0.7871.114-chromedriver-150.0.7871.114-grid-4.46.0-20260707@sha256:3400b92f1cddb2dfaaf358654e8f7d83d7be45192fb73c5f28c25faa28d36504"
          # SE_OPTS carries `--session-timeout`, the idle-session reaper. This is the
          # knob that actually caused the cascade in runs #13484/#13486: Grid's
          # 300s default killed a live session while one `drv.get` was still in
          # flight, so the first test failed and the next three died with
          # InvalidSessionIdException. Two traps worth recording:
          #   * SE_SESSION_TIMEOUT is not read by the entrypoint at all.
          #   * SE_SESSION_REQUEST_TIMEOUT is a different knob -- how long the
          #     router waits for a new-session request, not an inactivity
          #     reaper -- so raising it alone changes nothing.
          # The image exposes no dedicated env var for the reaper, so SE_OPTS
          # (appended verbatim to the java command) is the only hook. It must
          # stay above the client's pageLoadTimeout, or the reaper still wins
          # the race and the cascade returns; and below this job's timeout.
          #
          # SE_SESSION_REQUEST_TIMEOUT is required but is NOT the reaper: the
          # entrypoint emits `--session-request-timeout ${SE_SESSION_REQUEST_TIMEOUT}`
          # unconditionally, so it must stay set or that flag is left valueless.
          # It must not be repeated inside SE_OPTS -- doing so makes Grid
          # answer "Can only specify option --session-request-timeout once.",
          # print its usage text and exit 0, which surfaces as a sidecar that
          # never becomes ready. Only the reaper travels via SE_OPTS.
          #
          # --cpus/--memory: the sidecar is a sibling container, so it
          # inherited none of the job's limits and could pull the whole runner
          # host's CPU into Chromium. Budget it like the job itself.
          selenium_id="$(docker run -d \
            --network "container:${job_container}" \
            --shm-size=2g \
            --cpus=2 \
            --memory=3g \
            -e SE_SESSION_REQUEST_TIMEOUT=600 \
            -e SE_OPTS="--session-timeout 840" \
            "$selenium_image")"
          echo "E2E_SELENIUM_IMAGE=$selenium_image" >> "$GITHUB_ENV"
          echo "E2E_SELENIUM_CONTAINER=$selenium_id" >> "$GITHUB_ENV"
          echo "SELENIUM_REMOTE_URL=http://127.0.0.1:4444/wd/hub" >> "$GITHUB_ENV"

      - name: Keep local browser traffic off package proxy
        run: |
          set -euo pipefail
          no_proxy_value="${NO_PROXY:-}"
          no_proxy_value="${no_proxy_value:+${no_proxy_value},}localhost,127.0.0.1,::1"
          echo "NO_PROXY=$no_proxy_value" >> "$GITHUB_ENV"
          echo "no_proxy=$no_proxy_value" >> "$GITHUB_ENV"

      - name: Check browser runtime
        # CI-004: browser coverage is a required gate, not an optional
        # capability probe. Gitea uses the pinned Selenium service; GitHub-hosted
        # runners keep their preinstalled local Chrome/ChromeDriver path.
        run: |
          set -euo pipefail
          if [ -n "${SELENIUM_REMOTE_URL:-}" ]; then
            for attempt in 1 2; do
              if uv run python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          remote = os.environ["SELENIUM_REMOTE_URL"]
          status_url = remote.removesuffix("/wd/hub") + "/status"
          last_error = None
          # Budget must outlast the sidecar's real cold start on the runner
          # pool. Measured on master run #13456 (E2E job #55854): the pinned
          # standalone-chromium image needed ~22s just to reach "Starting
          # Selenium Grid Standalone..." and was still not answering /status
          # 41s later. A 60x1s probe expired at 62s, both attempts failed, and
          # a perfectly healthy browser was reported as a missing toolchain
          # (Connection refused x2). 180x1s keeps >2x headroom over the
          # observed worst case while still fitting twice inside the job's
          # 15-minute timeout alongside the container restarts.
          for _ in range(180):
              try:
                  with urllib.request.urlopen(status_url, timeout=2) as response:
                      payload = json.load(response)
                  if payload.get("value", {}).get("ready") is True:
                      print(f"Selenium service ready: {status_url}")
                      raise SystemExit(0)
              except Exception as exc:  # noqa: BLE001 - bounded CI readiness probe
                  last_error = exc
              time.sleep(1)
          print(f"Selenium service did not become ready: {last_error}")
          raise SystemExit(1)
          PY
              then
                break
              fi

              echo "::warning::Selenium sidecar readiness attempt ${attempt}/2 failed"
              if [ -n "${E2E_SELENIUM_CONTAINER:-}" ]; then
                docker inspect --format '{{json .State}}' "$E2E_SELENIUM_CONTAINER" || true
                docker logs --tail 200 "$E2E_SELENIUM_CONTAINER" || true
              fi
              if [ "$attempt" -eq 2 ]; then
                exit 1
              fi

              docker rm -f "$E2E_SELENIUM_CONTAINER" >/dev/null 2>&1 || true
              job_container="$(hostname)"
              selenium_id="$(docker run -d \
                --network "container:${job_container}" \
                --shm-size=2g \
                --cpus=2 \
                --memory=3g \
                -e SE_SESSION_REQUEST_TIMEOUT=600 \
            -e SE_OPTS="--session-timeout 840" \
                "$E2E_SELENIUM_IMAGE")"
              E2E_SELENIUM_CONTAINER="$selenium_id"
              echo "E2E_SELENIUM_CONTAINER=$selenium_id" >> "$GITHUB_ENV"
            done
          else
            driver="$(command -v chromedriver || true)"
            browser=""
            for candidate in chromium chromium-browser google-chrome; do
              if command -v "$candidate" >/dev/null 2>&1; then
                browser="$(command -v "$candidate")"
                break
              fi
            done
            if [ -z "$driver" ] || [ -z "$browser" ]; then
              echo "::error::Required local Selenium browser toolchain is unavailable (chromedriver=${driver:-missing}, browser=${browser:-missing})"
              exit 1
            fi
            uv run python -c "import selenium"
            echo "Local browser E2E preflight OK: driver=$driver browser=$browser"
          fi

      - name: E2E tests
        run: |
          set -euo pipefail
          uv run pytest tests/test_webui_e2e.py -m e2e -q --junitxml=e2e-results.xml
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("e2e-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if tests <= 0 or skipped != 0:
              print(
                  f"E2E execution proof failed: tests={tests}, skipped={skipped}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"E2E execution proof: tests={tests}, skipped={skipped}")
          PY

      - name: Stop Selenium Chromium sidecar
        if: always() && github.server_url != 'https://github.com'
        run: |
          set +e
          if [ -n "${E2E_SELENIUM_CONTAINER:-}" ]; then
            docker stop --time 5 "$E2E_SELENIUM_CONTAINER" >/dev/null 2>&1
            stop_status=$?
            docker rm -f "$E2E_SELENIUM_CONTAINER" >/dev/null 2>&1
            rm_status=$?
            if [ "$stop_status" -ne 0 ] || [ "$rm_status" -ne 0 ]; then
              echo "::warning::Selenium Chromium sidecar cleanup failed (docker stop=$stop_status, docker rm -f=$rm_status); teardown is non-fatal"
            fi
          fi
          exit 0

  build-and-push:
    # Runs the build+smoke-test steps on BOTH a real push to master AND a
    # pull_request -- only the final push-to-registry steps are gated to
    # master pushes. P1 BLOCKER audit finding: before this, a PR's `test`
    # job only ever exercised the source tree (ruff/mypy/pytest against
    # files on disk), never the actual Docker artifact -- a broken
    # Dockerfile, a missing system dependency, a bad COPY, or an
    # entrypoint crash would first surface after merge, in build-and-push
    # on master (or worse, in prod). Building and smoke-testing on PRs
    # closes that: the same image-boots-and-answers-healthy check M18
    # already does for master now runs before merge too, just without
    # ever touching the registry or :latest for an unmerged commit.
    # Mirrors quart-core's ci-cd.yml build-and-push job for the push path.
    #
    # These two jobs (build-and-push, deploy) only ever run on the
    # self-hosted Gitea runner pool (label docker-e2e-ci, Gitea at
    # git.example.com). GitHub's hosted runners have no such label AND their
    # Actions parser rejects `container:` without an `image:` (which the
    # Gitea runner accepts) — an invalid file fails every job in the
    # workflow there. So: skip them on GitHub entirely via
    # github.server_url (https://github.com vs Gitea's ROOT_URL), and give
    # deploy's container an explicit image (nod-ci-docker-e2e, the same
    # job image the Gitea runner's label already uses).
    needs: [scope]
    if: needs.scope.outputs.full_ci == 'true' && github.server_url != 'https://github.com' && (github.event_name == 'pull_request' || (github.ref_name == 'master' && github.event_name == 'push'))
    runs-on: docker-e2e-ci
    timeout-minutes: 20
    env:
      REGISTRY: 192.168.1.103:3005
      # Self-hosted runner pool has no direct internet; outbound egress goes
      # through the local Squid proxy (value stored in the CI_DOCKER_*_PROXY
      # repo variables, rendered below). docker build
      # (BuildKit) does NOT inherit proxy vars from the client env into
      # RUN layers, so they must be passed explicitly as --build-arg (both
      # case variants: apt reads lowercase, other tools uppercase).
      # NO_PROXY keeps internal hosts (Gitea, registry, CI network) direct.
      DOCKER_HTTP_PROXY: ${{ vars.CI_DOCKER_HTTP_PROXY }}
      DOCKER_HTTPS_PROXY: ${{ vars.CI_DOCKER_HTTPS_PROXY }}
      DOCKER_NO_PROXY: ${{ vars.CI_DOCKER_NO_PROXY }}
    container:
      volumes:
        - /media/1TB/Python/quart-platform/infra-quart/secrets/registry.token:/deploy/secrets/registry.token:ro
    steps:
      - uses: actions/checkout@v7
      - name: Log in to the Gitea container registry
        # Only needed for the push steps below -- skipped entirely for a
        # PR run, which never pushes anything, so a PR run doesn't even
        # need the shared registry credential available to it.
        if: github.event_name == 'push'
        run: |
          printf '%s\n' "$(cat /deploy/secrets/registry.token)" | bash scripts/ci-docker-login-retry.sh "$REGISTRY" gpakoh
      - name: Build web-ssh-gateway image
        run: |
          bash scripts/ci-docker-build-retry.sh -f docker/Dockerfile \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg http_proxy="$DOCKER_HTTP_PROXY" \
            --build-arg https_proxy="$DOCKER_HTTPS_PROXY" \
            --build-arg no_proxy="$DOCKER_NO_PROXY" \
            --build-arg HTTP_PROXY="$DOCKER_HTTP_PROXY" \
            --build-arg HTTPS_PROXY="$DOCKER_HTTPS_PROXY" \
            --build-arg NO_PROXY="$DOCKER_NO_PROXY" \
            -t "$REGISTRY/gpakoh/agent-ssh-gateway:${{ github.sha }}" \
            -t "$REGISTRY/gpakoh/agent-ssh-gateway:latest" \
            .
          GW_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$REGISTRY/gpakoh/agent-ssh-gateway:${{ github.sha }}")"
          printf '%s\n' "$GW_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::invalid local gateway image id: $GW_IMAGE_ID"; exit 1; }
          echo "CI_SMOKE_GW_IMAGE_ID=$GW_IMAGE_ID" >> "$GITHUB_ENV"
      - name: Build mcp-server image
        run: |
          bash scripts/ci-docker-build-retry.sh -f docker/Dockerfile.mcp-server \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg http_proxy="$DOCKER_HTTP_PROXY" \
            --build-arg https_proxy="$DOCKER_HTTPS_PROXY" \
            --build-arg no_proxy="$DOCKER_NO_PROXY" \
            --build-arg HTTP_PROXY="$DOCKER_HTTP_PROXY" \
            --build-arg HTTPS_PROXY="$DOCKER_HTTPS_PROXY" \
            --build-arg NO_PROXY="$DOCKER_NO_PROXY" \
            -t "$REGISTRY/gpakoh/mcp-server:${{ github.sha }}" \
            -t "$REGISTRY/gpakoh/mcp-server:latest" \
            .
          MCP_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$REGISTRY/gpakoh/mcp-server:${{ github.sha }}")"
          printf '%s\n' "$MCP_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::invalid local mcp-server image id: $MCP_IMAGE_ID"; exit 1; }
          echo "CI_SMOKE_MCP_IMAGE_ID=$MCP_IMAGE_ID" >> "$GITHUB_ENV"
      - name: Build sshd executor image
        run: |
          bash scripts/ci-docker-build-retry.sh -f docker/sshd/Dockerfile \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --build-arg http_proxy="$DOCKER_HTTP_PROXY" \
            --build-arg https_proxy="$DOCKER_HTTPS_PROXY" \
            --build-arg no_proxy="$DOCKER_NO_PROXY" \
            --build-arg HTTP_PROXY="$DOCKER_HTTP_PROXY" \
            --build-arg HTTPS_PROXY="$DOCKER_HTTPS_PROXY" \
            --build-arg NO_PROXY="$DOCKER_NO_PROXY" \
            -t "$REGISTRY/gpakoh/ssh-gateway-sshd:${{ github.sha }}" \
            -t "$REGISTRY/gpakoh/ssh-gateway-sshd:latest" \
            docker/sshd
          SSHD_IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$REGISTRY/gpakoh/ssh-gateway-sshd:${{ github.sha }}")"
          printf '%s\n' "$SSHD_IMAGE_ID" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::invalid local sshd image id: $SSHD_IMAGE_ID"; exit 1; }
          echo "CI_SMOKE_SSHD_IMAGE_ID=$SSHD_IMAGE_ID" >> "$GITHUB_ENV"
      - name: Smoke-test built images (before pushing, on a push; standalone, on a PR)
        # M18: until now, the freshly built image was never actually
        # started anywhere before landing in production -- the `test` job
        # only ever exercises the source tree, never the image itself (a
        # Dockerfile bug, a missing system dependency, a broken entrypoint
        # would first surface in prod). Run each image standalone and
        # confirm it boots and answers its own health path with HTTP 200 --
        # NOT the full compose stack: this runner is the same host the real
        # deploy runs on (docker-e2e-ci), and docker-compose.yml hardcodes
        # `container_name:` values identical to the live prod containers,
        # so bringing that stack up here would collide with (or shut down)
        # whatever is actually deployed. Uniquely-named, port-mapped
        # standalone containers avoid that entirely; this checks the image
        # itself starts cleanly, not full subsystem readiness (that's
        # deploy-from-registry.sh's own smoke(), against the real stack,
        # after deploy -- see M17).
        run: |
          set -euo pipefail
          GW_NAME="ci-smoke-gateway-${{ github.run_id }}"
          MCP_NAME="ci-smoke-mcp-${{ github.run_id }}"
          cleanup() {
            docker rm -f "$GW_NAME" "$MCP_NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          : "${CI_SMOKE_GW_IMAGE_ID:?local gateway image id was not recorded by the build step}"
          : "${CI_SMOKE_MCP_IMAGE_ID:?local mcp-server image id was not recorded by the build step}"
          : "${CI_SMOKE_SSHD_IMAGE_ID:?local sshd image id was not recorded by the build step}"

          # Smoke immutable local image IDs captured immediately after each
          # successful build. Never fall back to pulling the exact-SHA tag:
          # push happens only after this gate, so a missing local image must
          # fail locally instead of producing a misleading registry
          # "manifest unknown" error.
          # No -p port mappings: health probes use docker exec inside the
          # container's own namespace (see comments above), and hardcoded
          # host ports collide when two CI runs share a runner — the step
          # completes in ~1s with bind-address-in-use instead of the
          # expected 60s polling loop.
          docker run -d --name "$GW_NAME" \
            --memory=1g --memory-swap=1g \
            -e API_KEY=ci-smoke-only-not-a-real-secret \
            -e AGENT_TOKEN=ci-smoke-only-not-a-real-secret \
            -e JWT_SECRET=ci-smoke-only-not-a-real-secret \
            -e REDIS_URL=redis://127.0.0.1:1/0 \
            "$CI_SMOKE_GW_IMAGE_ID"

          docker run -d --name "$MCP_NAME" \
            --memory=1g --memory-swap=1g \
            -e MCP_CLIENT_SAFE_MODE=true \
            -e MCP_GATEWAY_TOOL_MODE=mcp_client \
            -e MCP_STREAMABLE_HTTP_HOST=0.0.0.0 \
            -e MCP_STREAMABLE_HTTP_ALLOW_NON_LOOPBACK=true \
            -e MCP_STREAMABLE_HTTP_BEARER_TOKEN=ci-smoke-only-not-a-real-secret \
            -e GATEWAY_BASE_URL=http://localhost:8085 \
            -e GATEWAY_API_KEY=ci-smoke-only-not-a-real-secret \
            "$CI_SMOKE_MCP_IMAGE_ID"

          # `curl localhost:$port` (an earlier approach here) is exactly
          # the anti-pattern deploy-from-registry.sh's own smoke() already
          # documents and avoids: this job runs inside its own container on
          # the docker-e2e-ci runner, a SIBLING of $GW_NAME/$MCP_NAME, not
          # sharing their network namespace -- "localhost" here is this
          # job's own loopback, not the host's, so the published -p ports
          # were never actually reachable this way.
          fail=false

          # mcp-server: probe /healthz directly inside the container instead
          # of waiting on Docker's HEALTHCHECK scheduler. The image healthcheck
          # runs every 30s; if startup misses the first probe, a 60s polling
          # window races the next probe and becomes flaky under runner load.
          # Production deploy still requires the real Docker health status.
          echo "Waiting for mcp-server to answer /healthz..."
          up=false
          for _ in $(seq 1 30); do
            if ! docker inspect --format '{{.State.Running}}' "$MCP_NAME" 2>/dev/null | grep -q true; then
              echo "::error::mcp-server container exited early"
              break
            fi
            if docker exec "$MCP_NAME" python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8087/healthz', timeout=4)" 2>/dev/null; then
              up=true
              break
            fi
            sleep 2
          done
          if [ "$up" != "true" ]; then
            echo "::error::mcp-server image never answered /healthz with HTTP 200"
            docker logs "$MCP_NAME" 2>&1 | tail -80
            fail=true
          else
            echo "mcp-server OK"
          fi

          # web-ssh-gateway: its HEALTHCHECK (M17) deliberately requires
          # /health's body to report status=="ok", which folds in SSH
          # reachability and Redis availability -- neither exists in this
          # deliberately dependency-free standalone container (no sshd, no
          # redis network peer), so status can only ever be "degraded"
          # here, and .State.Health.Status can never reach "healthy" no
          # matter how long this waited (confirmed live: the app itself
          # boots fine and /health already answers 200 within ~15s, but
          # docker inspect stayed "starting" for the full 60s timeout
          # regardless -- this is the exact anti-pattern M17 was built to
          # make honest, now colliding with a step that assumed "healthy"
          # was reachable everywhere). This step's own original intent
          # (see the comment above this whole step) was only ever "confirm
          # it boots and answers its own health path with HTTP 200" -- not
          # full subsystem readiness, which is deploy-from-registry.sh's
          # job against the real stack, where SSH/Redis genuinely exist.
          # `docker exec` runs inside the container's own namespace
          # regardless of where this script itself runs, avoiding the
          # curl-from-sibling-container problem without needing the
          # stricter Health.Status signal at all.
          echo "Waiting for web-ssh-gateway to answer /health..."
          up=false
          for _ in $(seq 1 30); do
            if ! docker inspect --format '{{.State.Running}}' "$GW_NAME" 2>/dev/null | grep -q true; then
              echo "::error::web-ssh-gateway container exited early"
              break
            fi
            if docker exec "$GW_NAME" python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=4)" 2>/dev/null; then
              up=true
              break
            fi
            sleep 2
          done
          if [ "$up" != "true" ]; then
            echo "::error::web-ssh-gateway image never answered /health with HTTP 200"
            docker logs "$GW_NAME" 2>&1 | tail -80
            fail=true
          else
            echo "web-ssh-gateway OK"
          fi

          echo "Validating sshd executor image..."
          if ! docker run --rm "$CI_SMOKE_SSHD_IMAGE_ID" sshd -t; then
            echo "::error::sshd executor image failed sshd -t"
            fail=true
          else
            echo "sshd executor OK"
          fi

          if [ "$fail" = "true" ]; then
            exit 1
          fi
      - name: Push web-ssh-gateway image
        # PRs build+smoke-test the image above but never push it -- an
        # unmerged commit must never become :latest or be pullable by
        # deploy-from-registry.sh.
        if: github.event_name == 'push'
        run: |
          docker push "$REGISTRY/gpakoh/agent-ssh-gateway:${{ github.sha }}"
          docker push "$REGISTRY/gpakoh/agent-ssh-gateway:latest"
      - name: Push mcp-server image
        if: github.event_name == 'push'
        run: |
          docker push "$REGISTRY/gpakoh/mcp-server:${{ github.sha }}"
          docker push "$REGISTRY/gpakoh/mcp-server:latest"
      - name: Push sshd executor image
        if: github.event_name == 'push'
        run: |
          docker push "$REGISTRY/gpakoh/ssh-gateway-sshd:${{ github.sha }}"
          docker push "$REGISTRY/gpakoh/ssh-gateway-sshd:latest"

  deploy:
    # Runs right after real images are pushed — pulls them, redeploys
    # web-ssh-gateway + mcp-server, smoke-tests, and rolls back to the
    # last known-good digest if the smoke check fails. The bind mount
    # below is this same repo's real checkout on the host (not a fresh
    # clone) — it's the only way to reach the real docker-compose.yml and
    # its gitignored docker/.env (real API_KEY/JWT_SECRET/ENCRYPTION_KEY
    # etc. aren't in git, so a fresh checkout here would silently fall
    # back to missing/placeholder credentials, and docker-compose.yml
    # requires them via `:?`). Mirrors quart-core's deploy job — see
    # scripts/deploy-from-registry.sh for the actual rollout+rollback
    # logic and its own notes on the runner's `valid_volumes: ["**"]`
    # config and why the smoke check can't curl "localhost" from inside
    # this job's container.
    needs: [build-and-push]
    if: github.ref_name == 'master' && github.event_name == 'push' && github.server_url != 'https://github.com'
    runs-on: docker-e2e-ci
    timeout-minutes: 15
    container:
      image: nod-ci-docker-e2e:latest
      volumes:
        # Deployment code must come from this workflow's exact checkout, not
        # from a mutable host working tree. Only runtime-only state is mounted
        # from the host: the gitignored environment and persistent rollback state.
        - /media/1TB/Python/web_ssh/web-ssh-gateway/docker/.env:/deploy/web-ssh-gateway.env:ro
        - /media/1TB/Python/web_ssh/web-ssh-gateway/.state:/deploy/web-ssh-gateway-state
        - /media/1TB/Python/quart-platform/infra-quart/secrets/registry.token:/deploy/secrets/registry.token:ro
    env:
      REGISTRY: 192.168.1.103:3005
      # Non-secret selector consumed by mcp-oauth/Compose. The credential itself
      # never enters MCP args or tracked files; the deploy job provisions the
      # operator-owned volume below from the Actions secret store.
      MCP_COMPOSE_DOCKER_CONFIG_VOLUME: mcp-compose-registry-auth
    steps:
      - uses: actions/checkout@v7
        with:
          # MAJOR audit finding: the deploy job publishes a full source
          # bundle (scripts/deploy-from-registry.sh::publish_agent_source_bundle
          # runs `git bundle create ... HEAD`) for agents to clone. Without
          # fetch-depth: 0, actions/checkout does a shallow clone, so a master
          # merge-deploy could publish a bundle whose advertised HEAD exists
          # but whose commit graph is missing parent objects (the published
          # bundles later fail `git fsck --connectivity-only`). Full ancestry
          # is required so the bundle is a connected object graph.
          fetch-depth: 0
      - name: Link runtime deployment inputs
        run: |
          test ! -e docker/.env
          test ! -e .state
          ln -s /deploy/web-ssh-gateway.env docker/.env
          ln -s /deploy/web-ssh-gateway-state .state
      # Each job gets its own fresh container — build-and-push's docker
      # login doesn't carry over, even on the same runner.
      - name: Log in to the Gitea container registry
        run: |
          printf '%s\n' "$(cat /deploy/secrets/registry.token)" | bash scripts/ci-docker-login-retry.sh "$REGISTRY" gpakoh
      - name: Provision Compose registry auth volume
        shell: bash
        run: |
          set -euo pipefail
          auth_volume="${MCP_COMPOSE_DOCKER_CONFIG_VOLUME:?MCP_COMPOSE_DOCKER_CONFIG_VOLUME must be set}"
          : "${REGISTRY:?REGISTRY must be set}"
          auth_config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
          test -s "$auth_config"

          # Reuse the exact MCP artifact from this workflow run as the immutable
          # helper container, but do not perform a second registry login here.
          # The preceding host-side login already succeeded with this runner's
          # registry transport policy (including HTTP/insecure registries).
          # Stream that authenticated Docker config over stdin into the
          # operator-owned volume so no credential value enters MCP args/env.
          runner_tag="$REGISTRY/gpakoh/mcp-server:${{ github.sha }}"
          docker pull "$runner_tag" >/dev/null
          runner_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$runner_tag")"
          case "$runner_ref" in
            "$REGISTRY/gpakoh/mcp-server@sha256:"*) ;;
            *)
              echo "::error::mcp-server registry digest is missing or from an unexpected repository" >&2
              exit 1
              ;;
          esac
          runner_digest="${runner_ref##*@sha256:}"
          printf '%s\n' "$runner_digest" | grep -Eq '^[0-9a-f]{64}$' || {
            echo "::error::mcp-server registry digest is not sha256:64hex" >&2
            exit 1
          }

          docker volume create "$auth_volume" >/dev/null
          docker run --rm -i \
            --user 0:0 \
            -v "$auth_volume:/docker-config" \
            --entrypoint /bin/sh \
            "$runner_ref" \
            -c 'set -eu; umask 077; cat > /docker-config/config.json; chmod 600 /docker-config/config.json' \
            < "$auth_config"
      - name: Deploy, smoke-test, roll back on failure
        # DEPLOY_SHA pins deploy-from-registry.sh to the exact commit that
        # triggered this run (build-and-push already tagged images with
        # both :latest and :${{ github.sha }}) instead of letting it
        # re-resolve :latest fresh at pull time. The top-level
        # `concurrency:` block now serializes master runs of this whole
        # workflow (deploy jobs from two close-together pushes can no
        # longer overlap at all) -- DEPLOY_SHA remains as defense-in-depth
        # for the narrower case that gate doesn't cover: a manual re-run
        # or workflow_dispatch replay resolving :latest to something
        # other than the commit that started this specific run.
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: bash scripts/deploy-from-registry.sh

  host-smoke:
    # Authoritative live host-smoke gate. Sequential regression contract
    # (see tests/test_deploy_config_seams.py::TestHostSmokeRunsAfterSuccessfulDeploy):
    #   1. This job cannot run before deploy -- it only starts after a
    #      successful deploy of THIS exact commit (needs: [deploy]).
    #      The old push-triggered paths:-filtered standalone workflow had
    #      no ordering guarantee vs deploy-from-registry.sh at all and
    #      could PASS against a stack still running the previous BUILD_SHA
    #      while the triggering commit's own deploy had not even started.
    #   2. Fail-closed pre-smoke check: the live BUILD_SHA of all three
    #      runtime containers must equal ${{ github.sha }} before any
# smoke runs -- a stale/unset SHA aborts (exit 1, no `|| true`).
      #   3. The OAuth black-box testcase must be EXACTLY 1 PASS, never
      #      SKIP -- a skip here means the live OAuth->Gateway->SSH chain
      #      was not actually exercised; pytest reports skips with exit 0,
      #      so the step greps its own output and fails on "skipped".
    #   4. After the OAuth smoke, BUILD_SHA is re-checked (the OAuth flow
    #      may not itself change containers, but the gate is re-asserted
    #      on the box that just ran 8788 for real), then the full
    #      `make host-smoke` (pytest -m host_smoke) runs.
    # Runs on the host-smoke-ci runner (real /media, nginx, Redis, and the
    # live Docker stack), not GitHub-hosted and not docker-in-docker.
    needs: [deploy]
    if: github.ref_name == 'master' && github.event_name == 'push' && github.server_url != 'https://github.com'
    runs-on: host-smoke-ci
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact deployed commit from Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          # Smoke the exact commit that was deployed, never whatever the
          # runner's mutable working tree happens to be. Check out straight
          # from this Gitea server (no actions/checkout, no github.com
          # dependency). The credential rides only in an extraHeader scoped
          # to the exact full REPO_URL inside one narrow subshell, so the
          # token never lands in the URL, argv, git config, stdout, or any
          # file. Secret handling runs ahead of every unrelated child. The
          # PATH is fixed to a known-safe standard value FIRST, so no
          # inherited entry can shadow the tools this step derives and uses
          # its credential with.
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          if [ -z "${GITEA_TOKEN:-}" ]; then
            echo "::error::GITEA_TOKEN is unset or empty" >&2
            exit 1
          fi
          gitea_token="$GITEA_TOKEN"
          unset GITEA_TOKEN
          # base64 without -w0 for portability; strip any CR/LF it emits.
          auth_header="Authorization: Basic $(printf '%s' "x-access-token:${gitea_token}" | base64 | tr -d '\r\n')"
          gitea_token=""
          unset gitea_token

          EXPECTED_SHA="${{ github.sha }}"
          if ! printf '%s' "$EXPECTED_SHA" | grep -qxE '[0-9a-f]{40}'; then
            echo "::error::EXPECTED_SHA is not a lowercase 40-hex sha" >&2
            exit 1
          fi

          # Neutralize every inherited exported GIT_*, SSH askpass, XDG_CONFIG_HOME
          # and proxy variable by NAME ONLY -- never enumerate values.
          for var_name in $(compgen -e); do
            case "$var_name" in
              GIT_*|XDG_CONFIG_HOME|SSH_ASKPASS|SSH_ASKPASS_REQUIRE|HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|FTP_PROXY|NO_PROXY|http_proxy|https_proxy|all_proxy|ftp_proxy|no_proxy)
                unset "$var_name"
                ;;
            esac
          done

          # Isolated chmod-700 HOME with a real private template dir (also
          # chmod-700), and global/system git config disabled so nothing
          # inherited can leak.
          private_home="$(mktemp -d)"
          chmod 700 "$private_home"
          mkdir -p "$private_home/git-template"
          chmod 700 "$private_home/git-template"
          trap 'rm -rf -- "$private_home"' EXIT
          export HOME="$private_home"
          export GIT_TEMPLATE_DIR="$private_home/git-template"
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_TERMINAL_PROMPT=0

          REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

          # Fail-closed stdlib-only URL validation: http/https scheme,
          # hostname, optional port in 1..65535, no userinfo/query/fragment,
          # non-empty non-root-only repository path, and no control or
          # whitespace character (covers NBSP and DEL). Runs in an isolated
          # interpreter (python3 -I -S) so no site/user packages or env can
          # influence it. No network access.
          python3 -I -S - "$REPO_URL" <<'PY'
          import sys
          import urllib.parse

          def validate(raw: str) -> str:
              if any(ord(c) < 0x20 or ord(c) == 0x7F or c.isspace() for c in raw):
                  raise ValueError("contains a forbidden control or whitespace character")
              parts = urllib.parse.urlsplit(raw)
              if parts.scheme not in ("http", "https"):
                  raise ValueError(f"scheme must be http or https, not {parts.scheme!r}")
              if not parts.hostname:
                  raise ValueError("missing hostname")
              if parts.username is not None or parts.password is not None:
                  raise ValueError("userinfo is not allowed")
              if parts.query or parts.fragment:
                  raise ValueError("query/fragment is not allowed")
              if not parts.path or not parts.path.rstrip("/"):
                  raise ValueError("repository path must not be empty or root-only")
              port = parts.port
              if port is not None and not (1 <= port <= 65535):
                  raise ValueError(f"port {port} is outside 1..65535")
              return raw

          if __name__ == "__main__":
              try:
                  validate(sys.argv[1])
              except ValueError as exc:
                  sys.stderr.write(f"::error::REPO_URL {sys.argv[1]!r}: {exc}")
                  raise SystemExit(1) from None
          PY

          # Self-hosted stale-repository defense: fail closed on an unusable
          # GITHUB_WORKSPACE, then purge ONLY the runner workspace .git
          # (never any other path) and init fresh; any failure aborts the step.
          # The guard uses only shell builtins (case / [ ] / parameter
          # expansion), never realpath/readlink/find/python, and rejects empty,
          # non-absolute, all-slashes/root, or traversal ("..") paths as well
          # as a symlink or missing/non-directory workspace, so the exact .git
          # deletion can never escape to a path outside the runner workspace.
          if [ -z "${GITHUB_WORKSPACE:-}" ]; then
            echo "::error::GITHUB_WORKSPACE is unset or empty" >&2
            exit 1
          fi
          case "$GITHUB_WORKSPACE" in
            /*) ;;
            *) echo "::error::GITHUB_WORKSPACE is not an absolute path" >&2; exit 1 ;;
          esac
          case "$GITHUB_WORKSPACE" in
            *[!/]*) ;;
            *) echo "::error::GITHUB_WORKSPACE is an all-slashes filesystem root" >&2; exit 1 ;;
          esac
          case "/$GITHUB_WORKSPACE/" in
            *"/../"*) echo "::error::GITHUB_WORKSPACE contains a .. path segment" >&2; exit 1 ;;
          esac
          if [ -L "$GITHUB_WORKSPACE" ]; then
            echo "::error::GITHUB_WORKSPACE is a symlink" >&2
            exit 1
          fi
          if [ ! -d "$GITHUB_WORKSPACE" ]; then
            echo "::error::GITHUB_WORKSPACE is not an existing directory" >&2
            exit 1
          fi
          rm -rf -- "$GITHUB_WORKSPACE/.git"
          git init -q "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$REPO_URL"

          # Credential config exists only for this single exact-SHA fetch,
          # in one narrow subshell, scoped to the exact full REPO_URL, with
          # redirects disabled. The header is cleared immediately after.
          (
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0="http.${REPO_URL}.extraHeader"
            export GIT_CONFIG_VALUE_0="$auth_header"
            export GIT_CONFIG_KEY_1="http.${REPO_URL}.followRedirects"
            export GIT_CONFIG_VALUE_1="false"
            git fetch -q --no-tags --depth=1 origin "$EXPECTED_SHA"
          )
          auth_header=""
          unset auth_header

          fetched="$(git rev-parse FETCH_HEAD)"
          if [ "$fetched" != "$EXPECTED_SHA" ]; then
            echo "::error::fetched commit $fetched != expected $EXPECTED_SHA" >&2
            exit 1
          fi

          git checkout -q -f --detach "$fetched"
          git clean -fdx

          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::HEAD $head_sha != expected $EXPECTED_SHA" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::worktree is not clean after checkout" >&2
            exit 1
          fi

      - name: Set up Python
        run: |
          python3 --version
          /media/1TB/Anaconda/bin/uv sync --frozen --extra dev

      - name: Fail-closed pre-smoke — all three containers must run this commit
        # BUILD_SHA is baked into each image at build time; the only way a
        # smoke test proves anything about THIS commit is if the live
        # containers are running it. Stale container (old image), unset
        # BUILD_SHA, or an unreachable container -> exit 1 before smoke.
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          for name in web-ssh-gateway mcp-server mcp-oauth; do
            sha="$(docker exec "$name" printenv BUILD_SHA 2>/dev/null)"
            echo "$name: BUILD_SHA=$sha"
            if [ "$sha" != "$expected" ]; then
              echo "::error::$name is running BUILD_SHA=$sha, expected $expected"
              exit 1
            fi
          done

      - name: OAuth black-box smoke (must be exactly 1 PASS, never SKIP)
        env:
          MCP_SMOKE_TIMEOUT: "90"
        # The mcp-oauth DCR->authorize->consent->token->git_status chain is
        # the P1 #6 gap: the only smoke that actually drives an SSH-executing
        # tool through the Gateway. `make host-smoke` later re-runs this same
        # file, but a pytest skip is exit 0, so this dedicated step enforces
        # "ran and passed" explicitly -- "skipped" or anything other than
        # exactly one passing testcase fails the job (RED).
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          if ! /media/1TB/Anaconda/bin/uv run pytest tests/test_mcp_oauth_host_smoke.py -v --tb=short >"$log_file" 2>&1; then
            cat "$log_file"
            exit 1
          fi
          cat "$log_file"
          if grep -Eq "skipped|SKIPPED" "$log_file"; then
            echo "::error::OAuth black-box host-smoke was SKIPPED, not run — the live OAuth->SSH chain was NOT exercised"
            exit 1
          fi
          if ! grep -Eq "1 passed" "$log_file"; then
            echo "::error::OAuth black-box host-smoke must be exactly 1 PASS, never SKIP"
            exit 1
          fi

      - name: Fail-closed post-OAuth — containers still on this commit
        run: |
          set -euo pipefail
          expected="${{ github.sha }}"
          for name in web-ssh-gateway mcp-server mcp-oauth; do
            sha="$(docker exec "$name" printenv BUILD_SHA 2>/dev/null)"
            echo "$name: BUILD_SHA=$sha"
            if [ "$sha" != "$expected" ]; then
              echo "::error::$name is running BUILD_SHA=$sha, expected $expected"
              exit 1
            fi
          done

      - name: Make host-smoke (full suite)
        run: /media/1TB/Anaconda/bin/uv run make host-smoke

      - name: Report
        run: |
          echo "post-deploy host-smoke completed"
          git rev-parse --short HEAD
