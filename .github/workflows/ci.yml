name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests examples/mcp_server

      - name: Mypy
        run: mypy app examples/mcp_server

      - name: Tests + coverage
        run: pytest -m "not host_smoke" --junitxml=test-results.xml --cov=app --cov-report=term-missing --cov-fail-under=69 -q

      - name: Verify test count
        run: |
          count=$(python -m pytest --collect-only -q 2>&1 | tail -1 | grep -oP '^\d+')
          echo "collected $count tests"
          if [ "$count" -lt 3500 ]; then
            echo "FAIL: test count ($count) below minimum 3500"
            exit 1
          fi
          echo "OK: $count tests >= 3500"

      - name: pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --strict --skip-editable --progress-spinner=off
