# agent-ssh-gateway — Nginx configuration
# Uses __DOMAIN__ / __BACKEND_IP__ / __API_KEY__ / __AUTH_DOMAIN__ placeholders.
# CI replaces these with actual values during deploy.

server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # P1 MAJOR audit finding: the auth cookie's Secure flag (see
    # JWT_COOKIE_SECURE) only stops the browser from sending it over an
    # already-established plain-HTTP connection -- it does nothing about
    # the FIRST request, before the port-80 server block's redirect above
    # has even happened, where a network attacker (open wifi, ARP
    # spoofing) could intercept a plain-HTTP request the browser was
    # ever tricked into making to this host. HSTS instructs the browser
    # to rewrite http:// to https:// itself for every future request to
    # this domain, closing that window after the first successful HTTPS
    # visit. includeSubDomains/preload omitted deliberately -- opt-in
    # scope creep to subdomains this config doesn't own is a separate,
    # explicit decision, not a default.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- mTLS for agent certificates ----
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client       optional;
    ssl_verify_depth        2;

    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
    proxy_set_header X-SSL-Client-Serial $ssl_client_serial;

    # Authelia authentication (one_factor)
    include /etc/nginx/snippets/authelia-location.conf;

    # Nginx-only liveness check — no auth, does not touch the backend.
    # Confirms nginx itself is up, nothing more.
    location /nginx-health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok"}';
    }

    # Real health — proxied to the backend, no auth (matches the backend's
    # own /health, which is deliberately unauthenticated). Audit finding:
    # this used to be nginx returning a static 200 unconditionally, so a
    # dead/degraded backend (Gateway process down, Redis/Postgres
    # unreachable) was invisible from outside -- external monitoring saw
    # green while the actual service was broken.
    location /health {
        access_log off;
        proxy_pass http://__BACKEND_IP__:8085/health;
        proxy_set_header Host $host;
    }

    # Default location — mTLS bypass, otherwise Authelia auth
    location / {
        if ($ssl_client_verify != "SUCCESS") {
            rewrite ^(.*)$ /_mtls-auth$1 last;
        }
        proxy_pass http://__BACKEND_IP__:8085;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-API-Key "__API_KEY__";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # WebSocket: execute/stream — mTLS bypass or Authelia fallback
    location /api/ssh/execute/stream {
        if ($ssl_client_verify != "SUCCESS") {
            rewrite ^ /_mtls-auth/api/ssh/execute/stream last;
        }
        proxy_pass http://__BACKEND_IP__:8085;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_set_header X-API-Key "__API_KEY__";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # WebSocket: PTY — mTLS bypass or Authelia fallback
    location /api/ssh/pty/ {
        if ($ssl_client_verify != "SUCCESS") {
            rewrite ^ /_mtls-auth/api/ssh/pty/ last;
        }
        proxy_pass http://__BACKEND_IP__:8085;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_set_header X-API-Key "__API_KEY__";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Auth-required fallback for requests without valid client cert
    location /_mtls-auth/ {
        internal;
        auth_request /authelia;
        error_page 401 =302 https://__AUTH_DOMAIN__/?rd=$scheme://$host$request_uri;

        rewrite ^/_mtls-auth/(.*)$ /$1 break;
        proxy_pass http://__BACKEND_IP__:8085;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_set_header X-API-Key "__API_KEY__";

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
